<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre commande — Mimistok</title>
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/anton-400.woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bleu:#2563eb; --bleu-fonce:#1d4ed8; --encre:#0b1220; --gris:#5b6b8c; --bord:#e2e6ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background:#fff; color:var(--encre); -webkit-font-smoothing:antialiased; }
  @media (prefers-color-scheme: dark) {
    body { background:#0b1220; color:#f7f8fa; }
    .carte { background:#131c2e !important; border-color:#33405c !important; }
    .ligne, .total, .champ { border-color:#33405c !important; }
    .muet { color:#9fb0cc !important; }
  }
  .bandeau { display:flex; align-items:center; justify-content:space-between; gap:1rem;
             padding:1rem 1.5rem; border-bottom:1px solid var(--bord); }
  .bandeau a { color:inherit; text-decoration:none; font-weight:800; letter-spacing:-.01em; }
  .marque { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size:1.4rem; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size: 2rem; margin: 0 0 .4rem; letter-spacing:-.01em; }
  .muet { color: var(--gris); font-size: .95rem; line-height: 1.6; }
  .carte { border:1px solid var(--bord); border-radius: 18px; padding: 1.4rem; margin-top: 1.5rem; background:#fff; }
  .ligne { display:flex; gap:1rem; align-items:center; padding: .9rem 0; border-bottom:1px solid var(--bord); }
  .ligne:last-child { border-bottom: 0; }
  .vignette { width:64px; height:64px; border-radius:12px; object-fit:cover; background:#eef0f4; flex:none; }
  .nom { font-weight: 700; font-size: .95rem; }
  .prix { font-variant-numeric: tabular-nums; }
  .qte { display:inline-flex; align-items:center; gap:.5rem; border:1px solid var(--bord); border-radius:999px; padding:.15rem .4rem; }
  .qte button { border:0; background:transparent; font-size:1rem; line-height:1; cursor:pointer; padding:.2rem .35rem; color:inherit; }
  .retirer { border:0; background:transparent; color:#dc2626; font-size:.8rem; cursor:pointer; padding:0; }
  .total { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--bord); margin-top:1rem; padding-top:1rem; font-size:1.1rem; }
  .total strong { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size:1.5rem; }
  .bouton { display:block; width:100%; margin-top:1.2rem; background:var(--bleu); color:#fff; border:0; cursor:pointer;
            padding:1rem; border-radius:999px; font-weight:800; font-size:1rem; text-align:center; text-decoration:none; }
  .bouton:hover { background:var(--bleu-fonce); }
  .bouton[disabled] { opacity:.6; cursor: default; }
  .badge { display:inline-block; padding:.2rem .7rem; border-radius:999px; font-size:.72rem; font-weight:800; }
  .ok { background: rgba(22,163,74,.15); color:#15803d; }
  .attente { background: rgba(217,119,6,.15); color:#b45309; }
  .vide { text-align:center; padding: 2.5rem 1rem; }
</style></head>
<body>
<header class="bandeau">
  <a href="/"><span class="marque">Mimistok</span></a>
  <a href="/produits" class="muet">Continuer mes achats</a>
</header>
<main class="wrap">
<h1 id="titre">Votre commande</h1>
<p class="muet" id="sous-titre">Nous vérifions le paiement…</p>
<div id="contenu" class="carte">Chargement…</div>
<p class="muet" id="suivi" style="margin-top:1rem"></p></main>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var ref = params.get("ref") || "";
  var jeton = params.get("t") || "";
  var contenu = document.getElementById("contenu");
  var titre = document.getElementById("titre");
  var sous = document.getElementById("sous-titre");
  var essais = 0;

  function euros(c) { return (Number(c || 0) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
  function echapper(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function peindre(d) {
    titre.textContent = d.confirmee ? "Merci " + ((d.client && d.client.nom) ? d.client.nom.split(" ")[0] : "") + " !" : "Commande reçue";
    sous.innerHTML = '<span class="badge ' + (d.confirmee ? 'ok' : 'attente') + '">'
      + (d.confirmee ? "Paiement confirmé" : "Paiement en cours de confirmation") + '</span>'
      + ' <span class="muet">Commande ' + echapper(d.reference) + '</span>';

    var lignes = (d.panier || []).map(function (l) {
      return '<div class="ligne"><div style="flex:1"><div class="nom">' + echapper(l.nom || l.slug) + '</div>'
        + '<div class="muet">' + echapper(l.quantite) + ' ×</div></div>'
        + '<div class="prix">' + euros((l.prix || 0) * (l.quantite || 1)) + '</div></div>';
    }).join("");

    var a = d.adresse || {};
    var adresse = [a.line1, a.line2, a.postal_code, a.city, a.country].filter(Boolean).join(", ");
    contenu.innerHTML = lignes
      + '<div class="total"><span>Total payé</span><strong>' + euros(d.total) + '</strong></div>'
      + (adresse ? '<p class="muet">Livraison : ' + echapper(adresse) + '</p>' : '')
      + (d.client && d.client.email ? '<p class="muet">Confirmation envoyée à ' + echapper(d.client.email) + '</p>' : '')
      + '<a class="bouton" href="/produits">Continuer mes achats</a>';

    if (!d.confirmee && essais < 6) {
      essais += 1;
      setTimeout(charger, 2500);
    } else if (!d.confirmee) {
      sous.innerHTML += ' <span class="muet">La confirmation peut prendre quelques instants.</span>';
    }
  }

  function charger() {
    if (!ref) { contenu.innerHTML = "Aucune commande indiquée."; return; }
    fetch("https://mimistok.marketc1euro.workers.dev/api/commande?ref=" + encodeURIComponent(ref) + "&t=" + encodeURIComponent(jeton))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || "Commande introuvable");
        peindre(d);
      })
      .catch(function (e) {
        titre.textContent = "Commande introuvable";
        sous.textContent = "Ce lien n'est pas valide, ou la commande n'est pas encore enregistrée.";
        contenu.innerHTML = '<a class="bouton" href="/produits">Retour à la boutique</a>';
      });
  }

  charger();
})();
</script>
</body></html>
