<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre panier — Mimistok</title>
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/anton-400.woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bleu:#2563eb; --bleu-fonce:#1d4ed8; --encre:#0b1220; --gris:#5b6b8c; --bord:#e2e6ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background:#fff; color:var(--encre); -webkit-font-smoothing:antialiased; }
  @media (prefers-color-scheme: dark) {
    body { background:#0b1220; color:#f7f8fa; }
    .carte { background:#131c2e !important; border-color:#33405c !important; }
    .ligne, .total, .champ { border-color:#33405c !important; }
    .muet { color:#9fb0cc !important; }
  }
  .bandeau { display:flex; align-items:center; justify-content:space-between; gap:1rem;
             padding:1rem 1.5rem; border-bottom:1px solid var(--bord); }
  .bandeau a { color:inherit; text-decoration:none; font-weight:800; letter-spacing:-.01em; }
  .marque { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size:1.4rem; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size: 2rem; margin: 0 0 .4rem; letter-spacing:-.01em; }
  .muet { color: var(--gris); font-size: .95rem; line-height: 1.6; }
  .carte { border:1px solid var(--bord); border-radius: 18px; padding: 1.4rem; margin-top: 1.5rem; background:#fff; }
  .ligne { display:flex; gap:1rem; align-items:center; padding: .9rem 0; border-bottom:1px solid var(--bord); }
  .ligne:last-child { border-bottom: 0; }
  .vignette { width:64px; height:64px; border-radius:12px; object-fit:cover; background:#eef0f4; flex:none; }
  .nom { font-weight: 700; font-size: .95rem; }
  .prix { font-variant-numeric: tabular-nums; }
  .qte { display:inline-flex; align-items:center; gap:.5rem; border:1px solid var(--bord); border-radius:999px; padding:.15rem .4rem; }
  .qte button { border:0; background:transparent; font-size:1rem; line-height:1; cursor:pointer; padding:.2rem .35rem; color:inherit; }
  .retirer { border:0; background:transparent; color:#dc2626; font-size:.8rem; cursor:pointer; padding:0; }
  .total { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--bord); margin-top:1rem; padding-top:1rem; font-size:1.1rem; }
  .total strong { font-family: Anton, "Arial Narrow", Impact, sans-serif; font-size:1.5rem; }
  .bouton { display:block; width:100%; margin-top:1.2rem; background:var(--bleu); color:#fff; border:0; cursor:pointer;
            padding:1rem; border-radius:999px; font-weight:800; font-size:1rem; text-align:center; text-decoration:none; }
  .bouton:hover { background:var(--bleu-fonce); }
  .bouton[disabled] { opacity:.6; cursor: default; }
  .badge { display:inline-block; padding:.2rem .7rem; border-radius:999px; font-size:.72rem; font-weight:800; }
  .ok { background: rgba(22,163,74,.15); color:#15803d; }
  .attente { background: rgba(217,119,6,.15); color:#b45309; }
  .vide { text-align:center; padding: 2.5rem 1rem; }
</style></head>
<body>
<header class="bandeau">
  <a href="/"><span class="marque">Mimistok</span></a>
  <a href="/produits" class="muet">Continuer mes achats</a>
</header>
<main class="wrap">
<h1>Votre panier</h1>
<p class="muet">Vérifiez vos articles, puis choisissez votre point de livraison sur la page de paiement Stripe.</p>
<div id="contenu" class="carte">Chargement du panier…</div>
<div id="erreur" class="muet" style="color:#dc2626;margin-top:1rem"></div></main>
<script>
(function(){
  var CLE = "panier";
  var contenu = document.getElementById("contenu");
  var zoneErreur = document.getElementById("erreur");

  function lire() { try { return JSON.parse(localStorage.getItem(CLE) || "[]") || []; } catch (e) { return []; } }
  function ecrire(p) { try { localStorage.setItem(CLE, JSON.stringify(p)); } catch (e) {} }
  function euros(c) { return (c / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
  function echapper(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function peindre() {
    var panier = lire();
    if (!panier.length) {
      contenu.innerHTML = '<div class="vide"><p>Votre panier est vide.</p><a class="bouton" href="/produits">Voir les produits</a></div>';
      return;
    }
    var total = 0;
    var html = panier.map(function (item, i) {
      total += item.prix * item.quantite;
      var cle = item.priceId || item.slug || "";
      return '<div class="ligne">'
        + '<div style="flex:1;min-width:0">'
        + '<div class="nom">' + echapper(item.nom || cle) + '</div>'
        + '<div class="muet">' + euros(item.prix) + ' · ' + echapper(item.quantite) + ' ×</div>'
        + (i >= 0 ? '<div class="qte" style="margin-top:.5rem">'
          + '<button type="button" data-moins="' + i + '" aria-label="Retirer un exemplaire">−</button>'
          + '<span>' + echapper(item.quantite) + '</span>'
          + '<button type="button" data-plus="' + i + '" aria-label="Ajouter un exemplaire">+</button>'
          + '</div>' : '')
        + '<button class="retirer" type="button" data-retirer="' + i + '">Retirer</button>'
        + '</div>'
        + '<div class="prix">' + euros(item.prix * item.quantite) + '</div>'
        + '</div>';
    }).join("");
    html += '<div class="total"><span>Total articles</span><strong>' + euros(total) + '</strong></div>'
      + '<p class="muet" style="margin:.4rem 0 0">Les frais de port sont calculés selon le poids du colis, sur la page de paiement.</p>'
      + '<button class="bouton" type="button" id="btn-commander">Commander</button>';
    contenu.innerHTML = html;
  }

  contenu.addEventListener("click", function (e) {
    var cible = e.target.closest ? e.target.closest("[data-plus],[data-moins],[data-retirer],#btn-commander") : null;
    if (!cible) return;
    var panier = lire();

    if (cible.id === "btn-commander") {
      if (!panier.length) return;
      cible.disabled = true;
      cible.textContent = "Redirection vers le paiement…";
      zoneErreur.textContent = "";
      fetch("https://mimistok.marketc1euro.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ panier: panier, pays: "fr" })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.url) { window.location.href = d.url; return; }
          throw new Error(d.error || d.details || "Réponse invalide du paiement");
        })
        .catch(function (err) {
          zoneErreur.textContent = "Erreur : " + err.message;
          cible.disabled = false;
          cible.textContent = "Commander";
        });
      return;
    }

    if (cible.dataset.plus !== undefined) {
      panier[Number(cible.dataset.plus)].quantite += 1;
    } else if (cible.dataset.moins !== undefined) {
      var i = Number(cible.dataset.moins);
      panier[i].quantite -= 1;
      if (panier[i].quantite <= 0) panier.splice(i, 1);
    } else if (cible.dataset.retirer !== undefined) {
      panier.splice(Number(cible.dataset.retirer), 1);
    }
    ecrire(panier);
    peindre();
  });

  peindre();
})();
</script>
</body></html>
